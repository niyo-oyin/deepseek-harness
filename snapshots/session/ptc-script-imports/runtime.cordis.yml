- id: ptc-runtime
  config:
    executionMode: vm-script
    scriptPersistence: true
    launch:
      kind: node-script
      executable: !!js process.execPath
      # The runner sits in the scenario directory, above any posix/ or windows/ fixture copy.
      bootstrapPath: !!js "process.env.DSH_SNAPSHOT_FILE.replace(/(?:[\\\\/](?:posix|windows))?[\\\\/][^\\\\/]+$/u, '') + '/runner.mjs'"
