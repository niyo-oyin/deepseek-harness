name: CI Python

# Python lanes run in their own workflow so a slow runtime build can be
# dispatched and re-run independently of the Linux CI workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

# A new dispatch on the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-sdk:
    runs-on: ubuntu-24.04
    name: python 3.10 / keyless SDK
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'
          cache: pip

      - name: Install uv
        run: python -m pip install uv==0.11.23

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Run complete keyless Python suite
        run: uv run --python 3.10 --group test --project python/sdk pytest

  # The reusable builder owns each executable, wheel, clean-install, and
  # keyless black-box path. This workflow builds Linux and Windows x64;
  # dispatch the builder directly for Linux ARM64 and both macOS architectures.
  python-runtime:
    needs: python-sdk
    name: python runtime / Linux and Windows x64
    uses: ./.github/workflows/build-exe-for-python-sdk.yml
    with:
      targets: node24-linux-x64,node24-win-x64
